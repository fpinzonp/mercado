<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de lectura sin internet</title>
  <style>
    body { font: 17px/1.5 system-ui, sans-serif; margin: 16px; max-width: 560px; }
    label.boton { display: block; text-align: center; padding: 14px; background: #1f6f43; color: #fff; border-radius: 10px; font-weight: 600; }
    input[type=file] { display: none; }
    pre { white-space: pre-wrap; background: #f2f2f2; padding: 12px; border-radius: 8px; }
    img { max-width: 100%; margin-top: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Prueba de lectura sin internet</h1>
  <p>Toma la foto de un empaque. Anota si funciona, cuánto tarda y si el texto sirve.</p>
  <label class="boton">Tomar foto<input id="foto" type="file" accept="image/*" capture="environment"></label>
  <p id="estado"></p>
  <img id="vista" alt="">
  <h2>Tamaño detectado</h2>
  <pre id="tamano">—</pre>
  <h2>Texto leído</h2>
  <pre id="texto">—</pre>
  <script type="module" src="/src/prueba-ocr.js"></script>
</body>
</html>
